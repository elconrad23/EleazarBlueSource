faq:
  title: Frequently Asked Questions
  description: Answers to common questions about the process and services.
  categories:
    - title: Services & Process
      questions:
        - label: What services do you offer?
          content: |
            We specialize in design and development of digital products, including environmental research, wireframing, interactive creating intuitive user interfaces, building responsive self-updating websites and web applications and developing systems.
        - label: What is your design process like?
          content: |
            We are collaborative and iterative, typically involving stages like Discovery & Research, Ideation & Prototyping, User Testing, Visual Design, and close collaboration with development teams during implementation. We tailor the process based on project needs, always focusing on sustainability-centered solutions.
        - label: Do you work with startups?
          content: |
            Absolutely! we encourage startups to join in us as we shape and create user-friendly environments from the ground up. We  adapt our processes to fit fast-paced startup environments.
    - title: Pricing & Timelines
      questions:
        - label: How much does a project typically cost?
          content: |
            Project costs vary based on scope, complexity, features, and timeline. For comprehensive development projects, our engagements typically start around $5,000, with average projects ranging between $8,000 and $25,000. For consulting or specific design tasks, our day rate is $700.
        - label: What are your payment terms?
          content: |
            We generally require a 40% deposit to schedule the project and begin work, with the remaining 60% due upon successful project completion and delivery. I accept payments via bank transfer and Stripe.
        - label: How long does a typical project take?
          content: |
            Timelines depend heavily on the project's scope and complexity. Smaller projects might take 3-4 weeks, while larger, more involved projects can range from 2 to 4 months. we always provide a detailed timeline estimate after the initial discovery phase.
        - label: Do you offer retainers or ongoing support?
          content: |
            Yes, for clients needing ongoing design support, feature development, or maintenance, we offer monthly retainer options tailored to specific needs. Let's discuss if this is something you're interested in.
    - title: About Us
      questions:
        - label: What do you enjoy most about your work?
          content: |
            We love the challenge of solving complex problems through design and technology. It's incredibly rewarding to see people interact with something we've created and find it genuinely useful and easy to navigate. Bridging the gap between user needs and technical possibilities is what truly excites us.
        - label: What are your hobbies outside of work?
          content: |
            When we're not designing or coding, we enjoy exploring East Africa's neighborhoods, trying out new coffee shops, and hiking in the nearby reservations. We're also passionate about photography and occasionally contribute to open-source projects.
