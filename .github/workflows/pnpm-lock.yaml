name: Update pnpm lockfile

on:
  workflow_dispatch:

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version: '24.18.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies (regenerate pnpm-lock.yaml)
        run: pnpm install

      - name: Commit updated lockfile
        run: |
          git config user.name "elconrad23"
          git config user.email "eleazarconrad@gmail.com"
          git checkout -b update/pnpm-lockfile
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm lockfile" || echo "No changes to commit"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update pnpm lockfile"
          title: "chore: update pnpm lockfile"
          body: "Regenerate pnpm-lock.yaml to match package.json (fix Vercel build)."
          base: main
          branch: update/pnpm-lockfile
